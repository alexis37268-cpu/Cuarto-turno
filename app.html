<title>Rueda y Quincena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app de una mano — encabezado de turno arriba, contenido por pestañas, barra de pestañas fija abajo */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#1b232b; --muted:#5d6b78; --line:#d5dce2;
  --accent:#e8a317; --accent-ink:#2a1d00; --steel:#2f4b63;
  --dia:#f2c14e; --noche:#3d5a80; --noche-ink:#fff; --franco:#dfe5ea; --franco-ink:#5d6b78;
  --bad:#c0392b; --good:#2e7d4f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --panel:#1b232b; --ink:#e7ecf0; --muted:#97a6b3; --line:#2c3842;
  --accent:#f0b43a; --accent-ink:#2a1d00; --steel:#9fc0dc;
  --dia:#d9a93a; --noche:#4f74a6; --noche-ink:#fff; --franco:#26313a; --franco-ink:#97a6b3;
  --bad:#ef6b5b; --good:#5cc08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#1b232b; --ink:#e7ecf0; --muted:#97a6b3; --line:#2c3842;
  --accent:#f0b43a; --accent-ink:#2a1d00; --steel:#9fc0dc;
  --dia:#d9a93a; --noche:#4f74a6; --noche-ink:#fff; --franco:#26313a; --franco-ink:#97a6b3;
  --bad:#ef6b5b; --good:#5cc08a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.5rem}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:.9rem}

/* Hoy */
.hero{border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:4px}
.hero .big{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-weight:700}
.t-D{background:var(--dia);color:#2a1d00}
.t-N{background:var(--noche);color:var(--noche-ink)}
.t-F{background:var(--franco);color:var(--franco-ink)}
.t-X{background:var(--steel);color:var(--bg)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.chip{display:inline-block;border-radius:6px;padding:3px 8px;font-weight:600;font-size:.85rem;white-space:nowrap}
.fer{color:var(--bad);font-weight:600;font-size:.8rem}

/* Calendario */
.calhead{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.72rem;color:var(--muted);font-weight:600;padding-bottom:2px}
.cell{aspect-ratio:1/1.15;max-width:100%;border-radius:7px;border:0;padding:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;font-size:.8rem;position:relative;min-width:0}
.cell b{font-family:var(--f-num);font-weight:500;font-size:.85rem}
.cell .tl{font-family:var(--f-display);font-weight:700;font-size:1rem;align-self:flex-end}
.cell.today{box-shadow:0 0 0 2px var(--ink)}
.cell .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.cell .ov{position:absolute;bottom:4px;left:5px;font-size:.62rem;font-weight:700;text-transform:uppercase}
.cell.out{visibility:hidden}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem}

/* Cobro */
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total .v{font-family:var(--f-num);font-size:1.7rem}
.neto{border-left:4px solid var(--accent);padding-left:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
td small{display:block;color:var(--muted);font-size:.78rem}
.tablebox{overflow-x:auto}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counts div{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.counts .num{font-size:1.3rem;display:block}

/* Formularios */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f span{font-size:.8rem;color:var(--muted)}
input,select,textarea{font:inherit;width:100%;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=checkbox]{width:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.rueda{display:flex;flex-wrap:wrap;gap:6px}
.rueda button{width:42px;height:48px;border-radius:8px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1}
.rueda button small{font-family:var(--f-num);font-size:.6rem;font-weight:500;opacity:.8}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
details[open] summary{margin-bottom:12px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:none;color:var(--muted);padding:10px 4px 12px;font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.02em;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}

/* Hoja de día */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;text-align:left;font-weight:600}
.opts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.note{font-size:.82rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<script>
const KEY='ruedaQuincena.v1';
const FERIADOS_2026=[
 ['2026-01-01','Año Nuevo'],['2026-02-16','Carnaval'],['2026-02-17','Carnaval'],['2026-03-24','Día de la Memoria'],
 ['2026-04-02','Malvinas'],['2026-04-03','Viernes Santo'],['2026-05-01','Día del Trabajo'],['2026-05-25','Revolución de Mayo'],
 ['2026-06-15','Paso a la Inmortalidad de Güemes'],['2026-06-20','Día de la Bandera'],['2026-07-09','Independencia'],
 ['2026-08-17','Paso a la Inmortalidad de San Martín'],['2026-10-12','Diversidad Cultural'],['2026-11-23','Soberanía Nacional'],
 ['2026-12-08','Inmaculada Concepción'],['2026-12-25','Navidad'],['2026-09-07','Día del Metalúrgico'],['2027-01-01','Año Nuevo']];
/* días en que la planta no trabaja: nadie va, se cobra el feriado */
const CERRADOS=['2026-01-01','2026-09-07','2026-12-25','2027-01-01'];
const DEF={
 nombre:'',
 rueda:'DDDFFFDDFFNNNFFFNNFF'.split(''),
 ancla:'2026-10-01', contra:false,
 turnos:{D:{ini:'06:00',fin:'18:00',noct:0,nt:0},N:{ini:'18:00',fin:'06:00',noct:0,nt:0}},
 horasTurno:12, base:8593.52, aumento:0,
 sabEq:29, domEq:36, sabCorte:'14:00', calHoras:11.25, calPct:20, calModo:'siempre', nocIni:'21:00', nocFin:'06:00', nocMin:8,
 antAnios:9, antPct:1, antTotal:9, desc:20,
 leche:16500, presentismo:44440, presPierde:true, tolTarde:15, ticket:60000,
 prodDia:2000, prodDias:30, prodHora:381.05, titulo:10566.96, plusFeriado:126000,
 alarmaMin:75, alarmasOn:true, alarma2:true, pctFer:175, ferModo:'promedio', ferProm:12, ferNoTrab:true, ferNoTrabHoras:12, noRem:false,
 feriados:[], ferQuitados:[], ferAuto:true, aumentos:[]
};
let S={cfg:structuredClone(DEF),days:{},bonos:{}};
let SAVED={};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);SAVED=p.cfg||{};S={cfg:{...structuredClone(DEF),...p.cfg},days:p.days||{},bonos:p.bonos||{}}}}catch(e){}
if(S.cfg.calHoras===11.5)S.cfg.calHoras=11.25; /* comida pasó a 45 min */
if(S.cfg.pctFer===100)S.cfg.pctFer=175; /* hora feriado ≈ hora promedio, según recibos */
function migrar(){const c=S.cfg;
  /* feriados: ahora se calculan solos para cualquier año; en la lista guardada quedan solo los agregados a mano */
  if(!SAVED.ferAuto&&SAVED.feriados){c.feriados=SAVED.feriados.filter(f=>!feriadosAuto(+f.d.slice(0,4)).some(a=>a.d===f.d))}
  c.ferAuto=true;if(!c.ferQuitados)c.ferQuitados=[];if(!c.aumentos)c.aumentos=[];
  /* el aumento viejo se aplica una vez sobre la hora y la casilla vuelve a cero */
  if(SAVED.base!=null&&nf(SAVED.aumento)){c.base=Math.round(nf(SAVED.base)*(1+nf(SAVED.aumento)/100)*100)/100;c.aumento=0}
  if(SAVED.antAnios!=null&&SAVED.antTotal==null)c.antTotal=nf(SAVED.antAnios)*nf(SAVED.antPct??1);
  save()}
if(S.cfg.ferNoTrabHoras===8)S.cfg.ferNoTrabHoras=12; /* el feriado no trabajado se paga el turno de 12 h */
if(['DDDFFDDFFF','DDDFFFDDFF'].includes((S.cfg.rueda||[]).join('')))S.cfg.rueda=DEF.rueda.slice(); /* ruedas de ejemplo viejas */
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof alarmasLuego==='function')alarmasLuego()}

/* ---------- fechas (todo en UTC para no correr días) ---------- */
const DAY=86400000;
const iso=t=>new Date(t).toISOString().slice(0,10);
const toT=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const hoyISO=()=>{const d=new Date();return iso(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))};
const dow=s=>new Date(toT(s)).getUTCDay(); // 0 dom
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtDia=s=>`${DOW[dow(s)]} ${+s.slice(8,10)}/${+s.slice(5,7)}`;
const money=v=>'$ '+v.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf=v=>(+v||0);
/* lee números como se escriben acá: 733.138,56 · 11,25 · 8593.52 · 7.636 */
function num(t){t=String(t??'').trim().replace(/[$\s]/g,'');if(t==='')return NaN;
  if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');
  else if((t.match(/\./g)||[]).length>1||/^\d{1,3}\.\d{3}$/.test(t))t=t.replace(/\./g,'');
  return parseFloat(t)}
const numv=t=>{const x=num(t);return isNaN(x)?0:x};

/* horas del turno que caen en horario nocturno (por convenio, desde las 21) */
const mins=t=>{const[h,m]=(t||'0:0').split(':');return +h*60+ +m};
function horasNoche(turno){const c=S.cfg,t=c.turnos[turno]||c.turnos.D;
  let a=mins(t.ini),b=mins(t.fin);if(b<=a)b+=1440;
  let na=mins(c.nocIni),nb=mins(c.nocFin);if(nb<=na)nb+=1440;
  let tot=0;for(const k of[-1440,0,1440])tot+=Math.max(0,Math.min(b,nb+k)-Math.max(a,na+k));
  return tot/60}
/* régimen planta: recargo sobre las horas de turno en rueda.
   sábado hasta las 14 → +50%; sábado desde las 14 y domingo → +100% */
function recargo(s,turno){const c=S.cfg,t=c.turnos[turno]||c.turnos.D,corte=mins(c.sabCorte);
  let a=mins(t.ini),b=mins(t.fin);if(b<=a)b+=1440;let r=0;
  for(let m=a;m<b;m+=15){const day=iso(toT(s)+Math.floor(m/1440)*DAY),tod=m%1440,w=dow(day);
    r+=(w===6?(tod<corte?0.5:1):w===0?1:0)*0.25}
  return r}
/* feriados nacionales de cualquier año (inamovibles, Carnaval y Semana Santa según la Pascua, trasladables
   según la ley 27.399: mar/mié → lunes anterior, jue/vie → lunes siguiente) + días de planta cerrada */
const _ferCache={};
function pascua(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return Date.UTC(y,mes-1,dia)}
function feriadosAuto(y){if(_ferCache[y])return _ferCache[y];
  const F=[],P=pascua(y),fx=(m,d)=>iso(Date.UTC(y,m-1,d)),add=(d,n,cerrado=false)=>F.push({d,n,cerrado,auto:true});
  const tras=(m,d,n)=>{let t=Date.UTC(y,m-1,d),w=new Date(t).getUTCDay();
    if(w===2)t-=DAY;else if(w===3)t-=2*DAY;else if(w===4)t+=4*DAY;else if(w===5)t+=3*DAY;add(iso(t),n)};
  add(fx(1,1),'Año Nuevo',true);add(iso(P-48*DAY),'Carnaval');add(iso(P-47*DAY),'Carnaval');
  add(fx(3,24),'Día de la Memoria');add(fx(4,2),'Malvinas');add(iso(P-2*DAY),'Viernes Santo');
  add(fx(5,1),'Día del Trabajo');add(fx(5,25),'Revolución de Mayo');tras(6,17,'Paso a la Inmortalidad de Güemes');
  add(fx(6,20),'Día de la Bandera');add(fx(7,9),'Independencia');tras(8,17,'Paso a la Inmortalidad de San Martín');
  add(fx(9,7),'Día del Metalúrgico',true);tras(10,12,'Diversidad Cultural');tras(11,20,'Soberanía Nacional');
  add(fx(12,8),'Inmaculada Concepción');add(fx(12,25),'Navidad',true);
  return _ferCache[y]=F}
function feriado(s){if((S.cfg.ferQuitados||[]).includes(s))return null;
  return S.cfg.feriados.find(f=>f.d===s)||feriadosAuto(+s.slice(0,4)).find(f=>f.d===s)||null}
function rueda(s,contra){const c=S.cfg,L=c.rueda.length;if(!L)return 'F';if(contra==null)contra=c.contra;
  const i=Math.round((toT(s)-toT(c.ancla))/DAY),k=((i%L)+L)%L,r=c.rueda[k];
  if(!contra)return r;
  if(r!=='F')return 'F';
  /* contraturno: trabaja cuando el turno descansa, en el mismo horario del ciclo (día o noche) */
  for(let j=1;j<=L;j++){const p=c.rueda[((k-j)%L+L)%L];if(p!=='F')return p}
  return 'D'}
/* día resuelto: qué pasa ese día */
function dia(s){
  const o=S.days[s]||{}, r=rueda(s);
  let est=o.estado||'auto', turno=o.turno||(r==='F'?'D':r);
  const fe=feriado(s);
  let trabaja = est==='auto' ? (r!=='F'&&!(fe&&fe.cerrado)) : (est==='trabajo'||est==='extra');
  if(est==='auto'&&fe&&fe.cerrado)est='franco';
  if(est==='auto') est = r==='F'?'franco':'trabajo';
  /* feriado con planta cerrada ya quedó como franco arriba */
  const t=S.cfg.turnos[turno]||S.cfg.turnos.D;
  return {s,est,turno,trabaja,rueda:r,over:!!o.estado&&o.estado!=='auto',
    h50:nf(o.h50),h100:nf(o.h100),tarde:trabaja?nf(o.tarde):0,hx:o.hx!=null&&o.hx!==''?nf(o.hx):nf(S.cfg.horasTurno),
    noct:o.noct!=null&&o.noct!==''?nf(o.noct):(trabaja?nf(t.noct):0),
    nt:o.nt!=null&&o.nt!==''?nf(o.nt):(trabaja?horasNoche(turno):0),
    cal:!trabaja?0:(o.cal!=null&&o.cal!==''?nf(o.cal):(S.cfg.calModo==='siempre'?nf(S.cfg.calHoras):0)), /* solo estando en planta */
    fer:feriado(s)};
}
const NOMBRE_EST={trabajo:'Trabajo',franco:'Franco',extra:'Día extra',falta:'Falta',licencia:'Licencia'};
function etiqueta(d){
  if(d.est==='franco')return{txt:d.fer&&d.fer.cerrado?'Planta cerrada':'Franco',cls:'t-F',l:'F'};
  if(d.est==='falta')return{txt:'Falta',cls:'t-F',l:'×'};
  if(d.est==='licencia')return{txt:'Licencia',cls:'t-X',l:'L'};
  const t=S.cfg.turnos[d.turno];
  const nom=d.turno==='N'?'Noche':'Día';
  return{txt:(d.est==='extra'?'Extra · ':'')+nom+' '+t.ini+'–'+t.fin,cls:'t-'+d.turno,l:d.turno};
}

/* ---------- cálculo de la liquidación (misma lógica de la planilla) ---------- */
function periodo(mes,parte){
  const y=+mes.slice(0,4),m=+mes.slice(5,7);
  const fin=new Date(Date.UTC(y,m,0)).getUTCDate();
  const [a,b]=parte==='1'?[1,15]:parte==='2'?[16,fin]:[1,fin];
  const out=[];for(let d=a;d<=b;d++)out.push(iso(Date.UTC(y,m-1,d)));
  return out;
}
/* hora promedio de las quincenas anteriores, como en el recibo: total de conceptos variables y fijos ÷ horas normales
   (sin antigüedad, título ni leche). La usa el feriado. */
const PROM_INC=['Horas normales','Régimen planta','Horas feriado','Días extra (dobles)','Horas extra 50%','Horas extra 100%','Horas nocturnas','Horas nocturnas (adicional)','Calorías','Presentismo','Mejora productiva','Ticket canasta','Tardanzas'];
function quincenasAntes(desde,k){const out=[];let t=toT(desde);
  for(let i=0;i<k;i++){const d=new Date(t-DAY),y=d.getUTCFullYear(),m=d.getUTCMonth()+1,dd=d.getUTCDate();
    const mes=`${y}-${String(m).padStart(2,'0')}`,q=dd<=15?'1':'2';const f=periodo(mes,q);out.push(f);t=toT(f[0])}
  return out}
function horaPromedio(desde){let tot=0,hs=0;
  for(const f of quincenasAntes(desde,nf(S.cfg.ferProm)||12)){const L=liquidar(f,1,1);
    const hn=L.n.normal*nf(S.cfg.horasTurno);if(!hn)continue; /* quincenas sin trabajo (licencia) no cuentan */
    tot+=L.R.filter(r=>PROM_INC.includes(r[0])).reduce((a,r)=>a+r[2],0);hs+=hn}
  return hs?tot/hs:0}
function liquidar(fechas,mult,depth=0){
  const c=S.cfg, vh=nf(c.base), ht=nf(c.horasTurno);
  const n={ferH:0,tarde:0,tardeDias:0,cal:0,reg:0,fer:0,normal:0,sab:0,dom:0,extra:0,extraH:0,lic:0,falta:0,franco:0,ferTrab:0,ferNoTrab:0,h50:0,h100:0,noct:0,nt:0};
  for(const s of fechas){
    const d=dia(s);
    n.h50+=d.h50;n.h100+=d.h100;n.noct+=d.noct;n.nt+=d.nt;n.cal+=d.cal;
    if(d.tarde){n.tarde+=d.tarde;n.tardeDias++}
    if(d.est==='extra'){n.extra++;n.extraH+=d.hx;if(d.fer)n.ferH+=nf(c.ferNoTrabHoras);continue}
    if(d.est==='trabajo'){
      if(d.fer){n.fer++;n.normal++;n.reg+=ht;n.ferH+=nf(c.ferNoTrabHoras)} /* feriado trabajado: turno + 100% de recargo + el feriado */
      else{n.normal++;if(dow(s)===6)n.sab++;if(dow(s)===0)n.dom++;
        /* llegar tarde también descuenta el recargo de esos minutos */
        const t0=S.cfg.turnos[d.turno]||S.cfg.turnos.D,w=dow(s),f0=w===6?(mins(t0.ini)<mins(S.cfg.sabCorte)?0.5:1):w===0?1:0;
        n.reg+=Math.max(0,recargo(s,d.turno)-f0*d.tarde/60)}
      continue}
    if(d.est==='licencia'){n.lic++;continue}
    if(d.est==='falta'){if(d.fer){if(c.ferNoTrab)n.ferH+=nf(c.ferNoTrabHoras);continue} n.falta++;continue} /* el feriado se paga vayas o no */
    n.franco++; if(d.fer&&c.ferNoTrab)n.ferH+=nf(c.ferNoTrabHoras);
  }
  const R=[];const add=(c1,det,v)=>{if(v)R.push([c1,det,v])};
  const vNormal=vh*ht;
  add('Horas normales',`${n.normal} turnos × ${ht} h`,n.normal*vNormal);
  add('Régimen planta',`${n.reg} h de recargo (sáb., dom.${n.fer?' y feriados':''})`,n.reg*vh);
  add('Días extra (dobles)',`${n.extra} día(s), ${n.extraH} h × ${money(vh*2)}`,n.extraH*vh*2);
  add('Licencia (estimado)',`${n.lic} días como día normal`,n.lic*vNormal);
  let vhFer=vh*nf(c.pctFer)/100,origen=`${nf(c.pctFer)}% de la hora`;
  if(n.ferH&&c.ferModo==='promedio'&&depth===0){const hp=horaPromedio(fechas[0]);if(hp){vhFer=hp;origen=`hora promedio últimas ${nf(c.ferProm)} quincenas`}}
  add('Horas feriado',`${n.ferH} h × ${money(vhFer)} (${origen})${n.fer?` · ${n.fer} trabajado(s), además del turno`:''}`,n.ferH*vhFer);
  add('Horas extra 50%',`${n.h50} h × ${money(vh*1.5)}`,n.h50*vh*1.5);
  add('Horas extra 100%',`${n.h100} h × ${money(vh*2)}`,n.h100*vh*2);
  add('Horas nocturnas',`${n.noct} h × ${money(vh)}`,n.noct*vh);
  add('Horas nocturnas (adicional)',`${n.nt} h nocturnas × ${nf(c.nocMin)} min = ${Math.round(n.nt*nf(c.nocMin)/6)/10} h`,n.nt*vh*nf(c.nocMin)/60);
  add('Calorías',`${n.cal} h al ${nf(c.calPct)}%`,n.cal*vh*nf(c.calPct)/100);
  add('Antigüedad',`${nf(c.antTotal)}% de las horas normales`,n.normal*vNormal*nf(c.antTotal)/100);
  /* presentismo: se pierde con una falta, o si la tardanza de la quincena pasa la tolerancia (15 min en total) */
  let presQ=0,motivo='';
  for(const q of [fechas.filter(s=>+s.slice(8)<=15),fechas.filter(s=>+s.slice(8)>15)]){if(!q.length)continue;
    let f=0,t=0;for(const s of q){const d=dia(s);if(d.est==='falta'&&!d.fer)f++;t+=d.tarde}
    if(c.presPierde&&f>0)motivo='perdido por falta';
    else if(t>nf(c.tolTarde))motivo=`perdido: ${t} min tarde (tolerancia ${nf(c.tolTarde)})`;
    else presQ++}
  add('Presentismo',motivo&&presQ?'una quincena perdida':'completo',presQ*nf(c.presentismo));
  if(motivo&&!presQ)R.push(['Presentismo',motivo,0]);
  if(n.tarde)R.push(['Tardanzas',`${n.tarde} min en ${n.tardeDias} día(s) × ${money(vh/60)} por minuto`,-n.tarde/60*vh]);
  const hProd=n.normal*ht; /* en el recibo: mejora productiva por hora de turno */
  add('Mejora productiva',`${hProd} h × ${money(nf(c.prodHora))}`,hProd*nf(c.prodHora));
  const m1=fechas[0].slice(8)==='01'?1:0; /* leche y título: solo en la 1ª quincena */
  add('Título','solo 1ª quincena',nf(c.titulo)*m1);
  add('Leche',(c.noRem?'no remunerativo · ':'')+'solo 1ª quincena',nf(c.leche)*m1);
  add('Ticket canasta',c.noRem?'no remunerativo':'',nf(c.ticket)*mult);
  /* bonos y sumas fijas que se cargan a mano por quincena */
  let bonoNoRem=0;
  for(const k of fechas.filter(s=>s.slice(8)==='01'||s.slice(8)==='16'))for(const b of (S.bonos[k]||[])){
    R.push(['Bono'+(b.n?': '+b.n:''),b.noRem?'no remunerativo (sin descuentos)':'remunerativo',nf(b.imp)]);if(b.noRem)bonoNoRem+=nf(b.imp)}
  const bruto=R.reduce((a,r)=>a+r[2],0);
  const noRem=(c.noRem?(nf(c.leche)*m1+nf(c.ticket)*mult):0)+bonoNoRem;
  const desc=(bruto-noRem)*nf(c.desc)/100;
  return{R,n,bruto,desc,neto:bruto-desc,vh};
}

function secuencia(contra){const L=S.cfg.rueda.length;return Array.from({length:L},(_,k)=>rueda(iso(toT(S.cfg.ancla)+k*DAY),contra))}
function infoBloque(seq,k){const L=seq.length,v=seq[k];let a=0,b=0;
  while(a<L-1&&seq[((k-a-1)%L+L)%L]===v)a++; while(b<L-1&&seq[(k+b+1)%L]===v)b++;
  let vuelve=null;for(let j=b+1;j<=L;j++){const p=seq[(k+j)%L];if(p!=='F'){vuelve=p;break}}
  return{len:a+b+1,quedan:b+1,vuelve}}
function largos(seq,est){const s=new Set();seq.forEach((v,k)=>{if(v===est)s.add(infoBloque(seq,k).len)});return[...s].sort((x,y)=>y-x)}

function wzPasos(){

  if(seq&&wz.estado&&largos(seq,wz.estado).length>1)p.push('bloque');
  p.push('quedan');
  if(wz.estado==='F'&&S.cfg.rueda.includes('D')&&S.cfg.rueda.includes('N'))p.push('vuelve');
  p.push('sueldo','calorias');
  p.push('listo');return p}
function wzIr(d){const p=wzPasos(),i=p.indexOf(wz.paso);wz.paso=p[Math.max(0,Math.min(p.length-1,i+d))];render();window.scrollTo(0,0)}
function wzUbicar(){
  const seq=secuencia(wz.contra);const bl=wz.bloque||largos(seq,wz.estado)[0];
  for(let k=0;k<seq.length;k++){if(seq[k]!==wz.estado)continue;const b=infoBloque(seq,k);
    if(b.len===bl&&b.quedan===wz.quedan&&(wz.estado!=='F'||!wz.vuelve||b.vuelve===wz.vuelve))return k}
  return -1}

    else{const ancla=iso(toT(hq)-k*DAY);let fila='';

        fila+=`<span class="chip t-${r}" style="padding:3px 0;text-align:center;font-size:.75rem">${DOW[dow(s)].slice(0,2)}<br>${+s.slice(8,10)}</span>`}

  return `<div class="stack">

const hhmm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function alarmasProx(dias){const out=[];
  for(let i=0;i<=dias;i++){const s=iso(toT(hq)+i*DAY),d=dia(s);if(!d.trabaja)continue;
    const t=S.cfg.turnos[d.turno]||S.cfg.turnos.D,m=mins(t.ini)-nf(S.cfg.alarmaMin);
    const sd=m<0?iso(toT(s)-DAY):s; if(sd<hq)continue;
    out.push({s,sd,hora:hhmm(m),entra:t.ini,turno:d.turno})}
  return out}

async function prepararAlarmas(){if(!LN)return;
  try{await LN.createChannel({id:'alarmas',name:'Alarmas de turno',description:'Te despierta para cada turno',importance:5,visibility:1,vibration:true,lights:true})}catch(e){}
  try{await LN.registerActionTypes({types:[{id:'alarma',actions:[{id:'posponer',title:'Posponer 10 min'},{id:'ok',title:'Ya me levanté'}]}]})}catch(e){}
  try{LN.addListener('localNotificationActionPerformed',async a=>{if(a.actionId==='posponer'){const n=a.notification;
    await LN.schedule({notifications:[{id:Math.floor(Date.now()/1000)%2000000000,title:n.title,body:'Pospuesta · '+(n.body||''),schedule:{at:new Date(Date.now()+10*60000),allowWhileIdle:true},channelId:'alarmas',actionTypeId:'alarma'}]})}})}catch(e){}
  programarAlarmas()}
async function programarAlarmas(){if(!LN)return;
  try{
    const pend=await LN.getPending();const viejas=(pend.notifications||[]).filter(n=>n.id>=1e8&&n.id<1e9);
    if(viejas.length)await LN.cancel({notifications:viejas.map(n=>({id:n.id}))});
    if(!S.cfg.alarmasOn){alEstado='Alarmas automáticas apagadas.';refrescarEstado();return}
    let p=await LN.checkPermissions();if(p.display!=='granted')p=await LN.requestPermissions();
    if(p.display!=='granted'){alEstado='Falta el permiso de notificaciones. Activalo en Ajustes del celu → Apps → Rueda y Quincena.';refrescarEstado();return}
    try{const ex=await LN.checkExactNotificationSetting();alExacta=ex.exact_alarm==='granted'}catch(e){alExacta=null}
    const ahora=Date.now(),lista=[];
    for(const a of alarmasProx(45)){const[h,m]=a.hora.split(':').map(Number);
      const at=new Date(+a.sd.slice(0,4),+a.sd.slice(5,7)-1,+a.sd.slice(8,10),h,m,0);if(at.getTime()<=ahora)continue;
      const base=1e8+(+a.sd.replace(/-/g,'').slice(2))*10; /* id único por día */
      const txt=`Entrás ${a.entra} · turno ${a.turno==='N'?'NOCHE':'DÍA'} · ${fmtDia(a.s)}`;
      lista.push({id:base,title:a.turno==='N'?'🌙 Hoy vas de NOCHE':'☀️ Hoy vas de DÍA',body:txt,schedule:{at,allowWhileIdle:true},channelId:'alarmas',actionTypeId:'alarma',ongoing:false,autoCancel:true});
      if(S.cfg.alarma2)lista.push({id:base+1,title:'⏰ Segundo aviso',body:txt,schedule:{at:new Date(at.getTime()+10*60000),allowWhileIdle:true},channelId:'alarmas',actionTypeId:'alarma'})}
    if(lista.length)await LN.schedule({notifications:lista});
    const prox=lista[0];
    alEstado=prox?`${lista.length} alarmas programadas. La próxima: ${prox.schedule.at.toLocaleString('es-AR',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}. Abrí la app al menos una vez por mes para que siga programando.`:'No hay turnos en los próximos 45 días.';
  }catch(e){alEstado='No se pudieron programar las alarmas: '+(e&&e.message||e)}
  refrescarEstado()}

function vCal(){
  const y=+calMes.slice(0,4),m=+calMes.slice(5,7);
  const first=iso(Date.UTC(y,m-1,1)), fin=new Date(Date.UTC(y,m,0)).getUTCDate();

/* carga desde el recibo: cada uno copia los importes tal cual figuran y la app saca los valores por hora */
const REC=[['hnCant','Horas normales: cantidad de horas','ej. 96'],['hnImp','Horas normales: importe TOTAL de la línea $','ej. 733.138,56'],['pres','Premio asistencia $',''],
  ['ley','Ley 26341 (ticket) $',''],['mejora','Mejora productiva $',''],['ant','Antigüedad $',''],['tit','Título $','solo 1ª quincena'],['leche','Leche $','solo 1ª quincena']];
function reciboForm(p){return `<p class="note" style="margin:0">Copiá los importes de tu último recibo trabajado. Dejá vacío lo que no tengas.</p>
  <div class="fields">${REC.map(([k,l,ph])=>`<label class="f"><span>${l}</span><input type="text" inputmode="decimal" step="any" id="${p}${k}" placeholder="${ph}"></label>`).join('')}</div>`}
function leerRecibo(p){const v={};for(const[k]of REC){const e=document.getElementById(p+k);if(e&&e.value!==''&&!isNaN(num(e.value)))v[k]=num(e.value)}return v}
function aplicarRecibo(v){const c=S.cfg,cambios=[];
  if(v.hnImp){let h=v.hnCant?v.hnImp/v.hnCant:v.hnImp;
    /* si da una hora absurda, seguro pusieron el valor de UNA hora en el importe */
    if(h<1000&&v.hnImp>=1000)h=v.hnImp;
    c.base=Math.round(h*100)/100;cambios.push('hora '+money(c.base))}
  if(v.pres!=null){c.presentismo=v.pres;cambios.push('presentismo')}
  if(v.ley!=null){c.ticket=v.ley;cambios.push('ticket')}
  if(v.mejora!=null&&v.hnCant){c.prodHora=Math.round(v.mejora/v.hnCant*100)/100;cambios.push('mejora '+money(c.prodHora)+'/h')}
  if(v.ant!=null&&v.hnImp){c.antTotal=Math.round(v.ant/v.hnImp*1000)/10;cambios.push('antigüedad '+c.antTotal+'%')}
  if(v.tit!=null){c.titulo=v.tit;cambios.push('título')}
  if(v.leche!=null){c.leche=v.leche;cambios.push('leche')}
  return cambios}

      <label class="f"><span>Llegué tarde (minutos)</span><input type="text" inputmode="decimal" step="1" id="dTarde" value="${o.tarde??''}"></label>
      <div class="row" style="gap:6px;align-items:flex-end"><button class="btn sm" data-set="dTarde:5">5</button><button class="btn sm" data-set="dTarde:15">15</button><button class="btn sm" data-set="dTarde:30">30</button></div>
      <label class="f"><span>Horas calóricas</span><input type="text" inputmode="decimal" step="any" id="dCal" value="${o.cal??''}" placeholder="${S.cfg.calModo==='siempre'?S.cfg.calHoras+' (auto)':'por orden'}"></label>
      <div class="row" style="gap:6px;align-items:flex-end"><button class="btn sm" data-set="dCal:4">4</button><button class="btn sm" data-set="dCal:6">6</button><button class="btn sm" data-set="dCal:${S.cfg.calHoras}">${S.cfg.calHoras}</button></div>
      <label class="f"><span>Hs nocturnas (vacío = automático)</span><input type="text" inputmode="decimal" step="any" id="dNoct" value="${o.noct??''}"></label>
      <label class="f"><span>Hs desde las 21 (vacío = auto)</span><input type="text" inputmode="decimal" step="any" id="dNt" value="${o.nt??''}" placeholder="${d.trabaja?horasNoche(d.turno):0}"></label>
    </div>
    <div class="row"><button class="btn pri" data-guardar style="flex:1">Guardar</button><button class="btn" data-limpiar>Dejar como la rueda</button></div>
  </div></div>`;
  sheet.hidden=false; sheet.dataset.dia=s; sheet.dataset.est=est;
}
sheet.addEventListener('click',e=>{
  const s=sheet.dataset.dia;
  const b=e.target.closest('button');
  if(!b){if(e.target.classList.contains('sheet-bg'))sheet.hidden=true;return}
  if(b.dataset.set){const[id,val]=b.dataset.set.split(':');sheet.querySelector('#'+id).value=val;
    if(b.dataset.pick){sheet.dataset.est=b.dataset.pick;sheet.querySelectorAll('[data-est]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.est===b.dataset.pick))}return}
  if(b.dataset.est){sheet.dataset.est=b.dataset.est;sheet.querySelectorAll('[data-est]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(b.hasAttribute('data-guardar')){
    const v=id=>sheet.querySelector('#'+id).value;
    const o={};
    if(sheet.dataset.est!=='auto')o.estado=sheet.dataset.est;
    if(v('dTurno'))o.turno=v('dTurno');
    ['hx:dHx','h50:dH50','h100:dH100','noct:dNoct','nt:dNt','cal:dCal','tarde:dTarde'].forEach(p=>{const[k,id]=p.split(':');if(v(id)!==''&&!isNaN(num(v(id))))o[k]=num(v(id))});
    if(Object.keys(o).length)S.days[s]=o;else delete S.days[s];
    save();sheet.hidden=true;render();toast('Día guardado');return}
  if(b.hasAttribute('data-limpiar')){delete S.days[s];save();sheet.hidden=true;render();toast('Vuelve a la rueda');return}
  if(b.hasAttribute('data-close'))sheet.hidden=true;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});

/* ---------- eventos ---------- */
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();window.scrollTo(0,0)}});
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const c=S.cfg;
  if(b.dataset.wz){const k=b.dataset.wz,v=b.dataset.val;
    wz[k]=k==='contra'?v==='true':(k==='bloque'||k==='quedan'||k==='comida')?+v:v;
    if(k==='contra'||k==='estado'){wz.bloque=null;wz.quedan=null;wz.vuelve=null}
    if(k==='bloque')wz.quedan=null;
    return wzIr(1)}
  if(b.hasAttribute('data-wznext')){
    if(wz.paso==='nombre')wz.nombre=document.getElementById('wzNombre').value.trim();
    if(wz.paso==='sueldo'){wz.rec=leerRecibo('wr_');const a=document.getElementById('wzAnios').value;wz.anios=a===''?null:numv(a)}
    return wzIr(1)}
  if(b.hasAttribute('data-wzback'))return wzIr(-1);
  if(b.hasAttribute('data-wzcancel')){tab='ajustes';render();return}
  if(b.dataset.wzfin){Object.assign(c,{nombre:wz.nombre,contra:wz.contra,ancla:b.dataset.wzfin,listo:true});
    if(wz.anios!=null)c.antTotal=wz.anios; if(wz.rec)aplicarRecibo(wz.rec);
    if(wz.calModo)c.calModo=wz.calModo; c.calHoras=nf(c.horasTurno)-0.75; /* comida de 45 min en todos los turnos */
    save();tab='hoy';render();window.scrollTo(0,0);toast('Configuración guardada');return}
  if(b.hasAttribute('data-wzstart')){wzNuevo();tab='setup';render();window.scrollTo(0,0);return}
  if(b.dataset.dia)return abrirDia(b.dataset.dia);
  if(b.dataset.go){tab=b.dataset.go;render();window.scrollTo(0,0);return}
  if(b.dataset.mes){const y=+calMes.slice(0,4),m=+calMes.slice(5,7)-1+ +b.dataset.mes;calMes=iso(Date.UTC(y,m,1)).slice(0,7);render();return}
  if(b.dataset.rueda){const i=+b.dataset.rueda;c.rueda[i]={D:'N',N:'F',F:'D'}[c.rueda[i]];save();render();return}
  if(b.dataset.contra){c.contra=b.dataset.contra==='1';save();render();toast(c.contra?'Estás en contraturno':'Estás en turno');return}
  if(b.dataset.plantilla){c.rueda=b.dataset.plantilla.split('');save();render();toast('Rueda cargada');return}
  if(b.dataset.rlen){if(+b.dataset.rlen>0)c.rueda.push('F');else if(c.rueda.length>1)c.rueda.pop();save();render();return}
  if(b.hasAttribute('data-addbono')){const imp=numv(document.getElementById('bnI').value);if(!imp){toast('Poné el importe');return}
    const q=cobroParte==='m'?document.getElementById('bnQ').value:(cobroParte==='2'?'16':'01'),k=cobroMes+'-'+q;
    (S.bonos[k]=S.bonos[k]||[]).push({n:document.getElementById('bnN').value.trim(),imp,noRem:document.getElementById('bnR').checked});
    save();render();toast('Bono agregado');return}
  if(b.dataset.delbono){const[k,i]=b.dataset.delbono.split('|');(S.bonos[k]||[]).splice(+i,1);if(S.bonos[k]&&!S.bonos[k].length)delete S.bonos[k];save();render();return}
  if(b.hasAttribute('data-recibo')){const ch=aplicarRecibo(leerRecibo('ar_'));save();render();toast(ch.length?'Cargado: '+ch.join(', '):'No cargaste ningún importe');return}
  if(b.hasAttribute('data-aum')){const p=numv(document.getElementById('aumPct').value);if(!p){toast('Poné el % del aumento');return}
    const k=1+p/100,r2=x=>Math.round(x*100)/100;
    c.base=r2(nf(c.base)*k);for(const f of['presentismo','prodHora','ticket','titulo','leche'])c[f]=r2(nf(c[f])*k);
    c.aumentos=(c.aumentos||[]).concat({f:hq,p});save();render();toast('Hora nueva: '+money(c.base));return}
  if(b.dataset.delfer){const d=b.dataset.delfer;if(c.feriados.some(f=>f.d===d))c.feriados=c.feriados.filter(f=>f.d!==d);else c.ferQuitados.push(d);save();render();return}
  if(b.dataset.resfer){c.ferQuitados=c.ferQuitados.filter(x=>x!==b.dataset.resfer);save();render();return}
  if(b.hasAttribute('data-addfer')){const d=document.getElementById('nfD').value,n=document.getElementById('nfN').value.trim()||'Feriado';
    if(!d){toast('Elegí la fecha');return} if(!feriado(d))c.feriados.push({d,n});save();render();toast('Feriado agregado');return}
  if(b.hasAttribute('data-alexacta')){try{LN.changeExactNotificationSetting().then(()=>programarAlarmas())}catch(e){}return}
  if(b.hasAttribute('data-alprueba')){try{LN.schedule({notifications:[{id:999999,title:'⏰ Prueba de alarma',body:'Si escuchaste esto, las alarmas funcionan.',schedule:{at:new Date(Date.now()+60000),allowWhileIdle:true},channelId:'alarmas',actionTypeId:'alarma'}]}).then(()=>toast('Suena en 1 minuto'),e=>toast('Error: '+e.message))}catch(e){toast('Error: '+e.message)}return}
  if(b.hasAttribute('data-copyal')){const txt=alarmasProx(14).map(a=>`${fmtDia(a.sd)} ${a.hora} (entro ${a.entra})`).join('\n');
    try{navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada'),()=>toast('No se pudo copiar'))}catch(_){toast('No se pudo copiar')}return}
  if(b.hasAttribute('data-copy')){const t=document.getElementById('bk');
    const ok=()=>toast('Código copiado'),fb=()=>{t.focus();t.select();toast('Seleccionado: copialo')};
    try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(_){fb()}return}
  if(b.hasAttribute('data-restore')){document.getElementById('rsConf').hidden=false;return}
  if(b.hasAttribute('data-restore-no')){document.getElementById('rsConf').hidden=true;return}
  if(b.hasAttribute('data-restore-ok')){
    try{const p=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('rs').value.trim()))));
      if(!p.cfg)throw 0; S={cfg:{...structuredClone(DEF),...p.cfg},days:p.days||{},bonos:p.bonos||{}};save();render();toast('Datos restaurados')}
    catch(_){toast('El código no es válido. Copialo completo.')}return}
  if(b.hasAttribute('data-reset')){document.getElementById('rsetConf').hidden=false;return}
  if(b.hasAttribute('data-reset-no')){document.getElementById('rsetConf').hidden=true;return}
  if(b.hasAttribute('data-reset-ok')){S={cfg:structuredClone(DEF),days:{},bonos:{}};save();render();toast('Valores de ejemplo cargados');return}
});
app.addEventListener('change',e=>{
  const t=e.target,c=S.cfg;
  if(t.id==='cMes'){if(t.value)cobroMes=t.value;render();return}
  if(t.id==='cParte'){cobroParte=t.value;render();return}
  if(t.dataset.cfg){c[t.dataset.cfg]=numv(t.value);save();if(t.dataset.cfg==='alarmaMin')render();return}
  if(t.dataset.cfgtxt){if(t.dataset.cfgtxt==='ancla'&&!t.value)return;c[t.dataset.cfgtxt]=t.value;save();if(t.dataset.cfgtxt==='ancla')toast('Rueda actualizada');return}
  if(t.dataset.cfgchk){c[t.dataset.cfgchk]=t.checked;save();return}
  if(t.dataset.turno){const[k,f]=t.dataset.turno.split('.');c.turnos[k][f]=t.type==='time'?t.value:numv(t.value);save();return}
});
migrar();
if(!S.cfg.listo){wzNuevo();tab='setup'}
render();
prepararAlarmas();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&LN){programarAlarmas();if(tab==='hoy')render()}});
</script>
